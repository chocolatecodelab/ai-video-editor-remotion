function captions(t){
 const idx=GROUPS.findIndex(g=>t>=g.s&&t<g.e),g=GROUPS[idx],el=$('#caption');
 if(idx!==gi){el.replaceChildren();if(g){const en=document.createElement('div');en.className='enline';for(const n of g.words){let sp=document.createElement('span');sp.textContent=WORDS[n].w+' ';sp.dataset.i=n;en.append(sp)}const id=document.createElement('div');id.className='idline';id.textContent=g.id;id.style.fontSize=BEATS.caption.translation_size+'px';id.style.marginTop=BEATS.caption.translation_gap+'px';el.append(en,id)}gi=idx}
 if(g){const enter=Math.min(1,(t-g.s)/.22);el.style.opacity=enter;el.style.transform=`translateY(${(1-enter)*9}px)`;el.style.filter=`blur(${(1-enter)*2}px)`;for(let sp of el.querySelectorAll('span')){let w=WORDS[+sp.dataset.i];sp.classList.toggle('active',t>=w.s&&t<w.e)}}
 else el.style.opacity=0;
 const last=WORDS.filter(w=>w.w.toLowerCase().replace(/[^a-z]/g,'')==='love');const closing=last.length&&t>=last[0].s;
 $('#last').textContent=closing?'Love remains':'';$('#last').style.opacity=closing?Math.min(1,(t-last[0].s)/.65):0;

 if(closing)el.style.opacity=0;
}
