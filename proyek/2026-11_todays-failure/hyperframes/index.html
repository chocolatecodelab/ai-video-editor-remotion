tl.to('#grain',{backgroundPosition:'96px 64px',duration:49.456,ease:'sine.inOut'},0);
tl.to({},{duration:.01},49.456);
let last=-2,lastBeat='';
function renderText(){const t=tl.time(),b=BEATS.find(b=>t>=b.s&&t<b.e)||BEATS.at(-1);
 if(b.id!==lastBeat){$('#heading').textContent=b.title;lastBeat=b.id}
 const idx=SUBS.findIndex(g=>t>=g.s&&t<g.e),g=SUBS[idx],c=$('#captions');
 if(idx!==last){c.replaceChildren();if(g){const en=document.createElement('div');en.className='en';for(const n of g.words){const s=document.createElement('span');s.textContent=WORDS[n].w+' ';s.dataset.word=n;en.append(s)}const id=document.createElement('div');id.className='id';id.textContent=g.id;c.append(en,id)}last=idx}
 if(g){const f=Math.min(1,(t-g.s+.08)/.18);c.style.opacity=f;for(const e of c.querySelectorAll('span')){const w=WORDS[+e.dataset.word];e.classList.toggle('active',t>=w.s&&t<w.e)}}else c.style.opacity=0;
}
tl.eventCallback('onUpdate',renderText);
window.__timelines.main=tl;
window.__review={seek(t){tl.pause(t,false);renderText()},beats:BEATS,subs:SUBS};
renderText();
</script></body></html>
